name: MFSYS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: node --check scripts/setup-editor.mjs
      - run: node --check scripts/upgrade-editor-password.mjs
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - run: npm run build
